# FileCloud — build the image from this source tree and run it (development / custom builds).
# Run from the repository root so the root .env is used:
#   docker compose -f deploy/docker-compose.yml --env-file .env up -d --build
# Uses the same project name and volumes as the root docker-compose.yml, so you can switch
# between the published image and a local build without losing data.
name: filecloud

services:
  filecloud:
    image: filecloud:local
    build: ../app
    container_name: filecloud
    restart: unless-stopped
    env_file: ../.env           # every setting comes from the root .env
    ports:
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-8080}:8080"
    volumes:
      # User files — the app-data volume, or a host folder such as your NFS mount.
      - ${DATA_PATH:-app-data}:/data
      # Database — keep on a local disk (not NFS).
      - ${DB_PATH:-db-data}:/var/lib/filecloud/db

volumes:
  app-data:
  db-data:
