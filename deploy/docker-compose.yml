# Cloudy — build the image from this source tree and run it (development / custom builds).
# Run from the repository root so the root .env is used:
#   docker compose -f deploy/docker-compose.yml --env-file .env up -d --build
# Uses the same project name and volumes as the root docker-compose.yml, so you can switch
# between the published image and a local build without losing data.
name: cloudy

services:
  cloudy:
    image: cloudy:local
    build: ../app
    container_name: cloudy
    restart: unless-stopped
    # Settings: edit the defaults here, or set them in a .env file next to this file
    # (Compose reads .env automatically and its values win). See .env.example.
    environment:
      # First administrator, created on first start. Empty password = generated and printed in the log.
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # uid:gid the server and database run as (owns the files it writes).
      APP_USER: ${APP_USER:-1000:1000}
      # true when behind a reverse proxy (real client IPs, HTTPS-only cookies).
      TRUST_PROXY: ${TRUST_PROXY:-false}
      # Address users open Cloudy at (passkeys are bound to it). Empty = taken from each request's Host.
      PUBLIC_URL: ${PUBLIC_URL:-}
      # Built-in office editor (Collabora Online, ~1 GB RAM): false turns it off. Home mode hides its
      # welcome/feedback pop-ups but limits it to 20 connections / 10 open documents.
      OFFICE: ${OFFICE:-true}
      OFFICE_HOME_MODE: ${OFFICE_HOME_MODE:-false}
      # Days before trashed items are deleted; versions kept per file; days a browser login lasts.
      TRASH_RETENTION_DAYS: ${TRASH_RETENTION_DAYS:-30}
      MAX_VERSIONS: ${MAX_VERSIONS:-20}
      SESSION_DAYS: ${SESSION_DAYS:-14}
      # Leave empty to use the built-in PostgreSQL; or postgres://user:pass@host:5432/cloudy
      DATABASE_URL: ${DATABASE_URL:-}
    ports:
      # APP_BIND=127.0.0.1 keeps it reachable only from this machine (reverse proxy on the same host).
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-8080}:8080"
    volumes:
      # User files (DATA_PATH): the app-data volume, or an absolute host folder such as your NFS mount.
      - ${DATA_PATH:-app-data}:/data
      # Database (DB_PATH): the db-data volume or an absolute host folder — keep it on a local disk, not NFS.
      - ${DB_PATH:-db-data}:/var/lib/cloudy/db

volumes:
  app-data:
  db-data:
