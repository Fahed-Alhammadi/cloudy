# XcodeGen spec: `xcodegen generate` (or ./build.sh) writes CloudyDrive.xcodeproj, which is git-ignored.
# Two targets: the menu bar app (io.cloudy.drive) embeds the File Provider extension (io.cloudy.drive.provider).
# The API client and models are shared with the iOS app (ios/Cloudy/Data).
name: CloudyDrive
options:
  bundleIdPrefix: io.cloudy
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "JEXQBK3SQ5"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  CloudyDrive:
    type: application
    platform: macOS
    sources:
      - path: CloudyDrive
      - path: Shared
      - path: Resources
      - path: ../ios/Cloudy/Data/API.swift
      - path: ../ios/Cloudy/Data/Models.swift
    dependencies:
      - target: Provider
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.cloudy.drive
        PRODUCT_NAME: Cloudy Drive
        INFOPLIST_FILE: CloudyDrive/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: CloudyDrive/CloudyDrive.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  Provider:
    type: app-extension
    platform: macOS
    sources:
      - path: Provider
      - path: Shared
      - path: ../ios/Cloudy/Data/API.swift
      - path: ../ios/Cloudy/Data/Models.swift
      - path: Resources/Localizable.xcstrings
      - path: Resources/Assets.xcassets   # its AppIcon is the Cloudy icon in Finder's sidebar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.cloudy.drive.provider
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_NAME: Provider
        INFOPLIST_FILE: Provider/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Provider/Provider.entitlements
        SKIP_INSTALL: YES
