# FileCloud — one container: the server and its PostgreSQL database.
#   cp .env.example .env            # adjust settings
#   docker compose up -d --build    # build from source and start
# Over-the-air server updates (needs FILECLOUD_IMAGE to be a registry image):
#   docker compose --profile autoupdate up -d
# The app listens on APP_PORT (default 8080). In production put it behind your
# reverse proxy (TLS termination) and set TRUST_PROXY=true.
name: filecloud

services:
  filecloud:
    image: ${FILECLOUD_IMAGE:-filecloud:local}
    build: ./app
    container_name: filecloud
    restart: unless-stopped
    env_file: .env              # every setting comes from .env (see .env.example)
    ports:
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-8080}:8080"
    volumes:
      # User files — the app-data volume, or a host folder such as your NFS mount.
      - ${DATA_PATH:-app-data}:/data
      # Database — keep on a local disk (not NFS).
      - ${DB_PATH:-db-data}:/var/lib/filecloud/db

  # Optional (profile "autoupdate"): pulls a newer FILECLOUD_IMAGE every UPDATE_INTERVAL
  # seconds and restarts FileCloud with it.
  updater:
    image: docker:27-cli
    profiles: [autoupdate]
    restart: unless-stopped
    environment:
      UPDATE_INTERVAL: ${UPDATE_INTERVAL:-21600}
      FILECLOUD_IMAGE: ${FILECLOUD_IMAGE:-filecloud:local}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/project:ro
    entrypoint: ["/bin/sh", "/project/scripts/auto-update.sh"]

volumes:
  app-data:
  db-data:
