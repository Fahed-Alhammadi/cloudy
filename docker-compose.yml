# FileCloud — one container (server + built-in PostgreSQL), run from the published image.
# Put this file and your .env in one folder, then:
#   docker compose up -d                              # start
#   docker compose pull && docker compose up -d       # update to the latest image
# All settings live in .env (see .env.example). To build from source instead, see deploy/docker-compose.yml.
# The app listens on APP_PORT (default 8080). In production put it behind your reverse proxy
# (TLS termination) and set TRUST_PROXY=true.
name: filecloud

services:
  filecloud:
    image: ghcr.io/fahed-alhammadi/filecloud:latest
    container_name: filecloud
    restart: unless-stopped
    env_file: .env              # every setting comes from .env
    ports:
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-8080}:8080"
    volumes:
      # User files — the app-data volume, or a host folder such as your NFS mount.
      - ${DATA_PATH:-app-data}:/data
      # Database — keep on a local disk (not NFS).
      - ${DB_PATH:-db-data}:/var/lib/filecloud/db

volumes:
  app-data:
  db-data:
