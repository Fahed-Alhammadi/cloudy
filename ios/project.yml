# XcodeGen spec: `xcodegen generate` (or ./build.sh) writes Cloudy.xcodeproj, which is git-ignored.
name: Cloudy
options:
  bundleIdPrefix: io.cloudy
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    MARKETING_VERSION: "1.10.1"
    CURRENT_PROJECT_VERSION: "2"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "JEXQBK3SQ5"          # your Apple Team ID (or pick the team in Xcode → Signing & Capabilities)
    CODE_SIGN_STYLE: Automatic
targets:
  Cloudy:
    type: application
    platform: iOS
    sources:
      - path: Cloudy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.cloudy.app
        PRODUCT_NAME: Cloudy
        INFOPLIST_FILE: Cloudy/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES
