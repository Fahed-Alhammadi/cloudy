# Android app (Google Play). Runs when android/ changes.
#   - every push / pull request: debug build
#   - push to main with an unreleased versionName (scripts/version.py bump android X.Y.Z): signed bundle → Play
#     closed-testing track (promote to production by hand in Play Console), then tag android-vX.Y.Z + GitHub release.
# Secrets: ANDROID_KEYSTORE_BASE64 (base64 of android/cloudy-release.keystore), ANDROID_KEYSTORE_PASSWORD,
#   ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD, PLAY_SERVICE_ACCOUNT_JSON (Play Developer API service account key).
# Variables (optional): PLAY_TRACK (default "alpha" = closed testing), PLAY_RELEASE_STATUS (default "completed").
# Without the secrets the release job only builds what it can and doesn't tag, so the version stays unreleased.
name: Android

on:
  push:
    branches: [main]
    paths: &paths
      - 'android/**'
      - 'scripts/version.py'
      - 'scripts/github-release.sh'
      - '.github/workflows/android.yml'
  pull_request:
    paths: *paths
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

  release:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }} # secrets can't be tested in `if` directly
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: v
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "version=$(scripts/version.py get android)" >> "$GITHUB_OUTPUT"
          if scripts/version.py released android; then
            echo "::notice::Android $(scripts/version.py get android) is already released. Run scripts/version.py bump android X.Y.Z to publish a new one."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ -z "$KEYSTORE" ]; then
            echo "::warning::No signing secrets: Android $(scripts/version.py get android) not published."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-java@v6
        if: steps.v.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
        if: steps.v.outputs.skip != 'true'
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - name: Build signed Play bundle
        if: steps.v.outputs.skip != 'true'
        working-directory: android
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE" | base64 -d > cloudy-release.keystore
          printf 'storeFile=cloudy-release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$STORE_PW" "$ALIAS" "$KEY_PW" > keystore.properties
          ./gradlew --no-daemon bundleRelease
          cp app/build/outputs/bundle/release/app-release.aab "Cloudy-${{ steps.v.outputs.version }}.aab"
      - uses: actions/upload-artifact@v5
        if: steps.v.outputs.skip != 'true'
        with:
          name: play-bundle
          path: |
            android/Cloudy-*.aab
            android/app/build/outputs/mapping/release/mapping.txt
      - name: Upload to Google Play
        if: steps.v.outputs.skip != 'true' && env.PLAY_JSON != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: io.cloudy.app
          releaseFiles: android/Cloudy-*.aab
          mappingFile: android/app/build/outputs/mapping/release/mapping.txt
          track: ${{ vars.PLAY_TRACK || 'alpha' }}
          status: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}
      - name: Tag and GitHub release
        if: steps.v.outputs.skip != 'true' && env.PLAY_JSON != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/github-release.sh android "Android" false android
      - name: Not uploaded
        if: steps.v.outputs.skip != 'true' && env.PLAY_JSON == ''
        run: echo "::warning::PLAY_SERVICE_ACCOUNT_JSON not set. The bundle is in the workflow artifacts; upload it in Play Console. Not tagged."
