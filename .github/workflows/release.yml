# Push a tag like v1.2.0 to publish:
#   - the server image ghcr.io/<owner>/filecloud:<version> and :latest (used by the auto-updater)
#   - a signed Android APK attached to the GitHub release (if signing secrets are configured)
# Repository secrets for signing (same key as your installed apps!):
#   ANDROID_KEYSTORE_BASE64  base64 of mobile/android/filecloud-release.keystore
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/filecloud" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: app
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: APP_VERSION=${{ steps.meta.outputs.version }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: Signing key
        id: key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ]; then echo "No signing secrets — skipping APK"; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "$KEYSTORE" | base64 -d > mobile/android/filecloud-release.keystore
          printf 'storeFile=filecloud-release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$STORE_PW" "$ALIAS" "$KEY_PW" > mobile/android/keystore.properties
      - name: Build signed APK
        if: steps.key.outputs.skip != 'true'
        working-directory: mobile/android
        run: |
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "FileCloud-${GITHUB_REF_NAME#v}.apk"
      - uses: softprops/action-gh-release@v2
        if: steps.key.outputs.skip != 'true'
        with:
          files: mobile/android/FileCloud-*.apk
          generate_release_notes: true
