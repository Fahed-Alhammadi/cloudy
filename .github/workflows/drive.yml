# Cloudy Drive for macOS (menu bar app + File Provider extension). Runs when drive/ or the shared iOS API code changes.
#   - every push / pull request: unsigned compile check (drive/build.sh check)
#   - push to main with an unreleased version in drive/project.yml (scripts/version.py bump drive X.Y.Z): Release build
#     signed with Developer ID, notarized + stapled .dmg, then tag drive-vX.Y.Z + GitHub release with the .dmg (the
#     app's "Download Cloudy Drive X.Y.Z" menu item looks for the newest drive-v* release).
# Secrets: MACOS_CERTIFICATE_P12 + MACOS_CERTIFICATE_PASSWORD (Developer ID Application, as for the desktop app) and the
#   App Store Connect API key ASC_KEY_ID / ASC_ISSUER_ID / ASC_PRIVATE_KEY (Xcode signing + notarization).
name: Drive

on:
  push:
    branches: [main]
    paths: &paths
      - 'drive/**'
      - 'ios/Cloudy/Data/API.swift'
      - 'ios/Cloudy/Data/Models.swift'
      - 'scripts/version.py'
      - 'scripts/github-release.sh'
      - '.github/workflows/drive.yml'
  pull_request:
    paths: *paths
  workflow_dispatch:

concurrency:
  group: drive-${{ github.ref }}

jobs:
  build:
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: v
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          if [ "$GITHUB_EVENT_NAME" != pull_request ] && [ "$GITHUB_REF" = refs/heads/main ] && ! scripts/version.py released drive; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Compile check
        if: steps.v.outputs.release != 'true'
        run: drive/build.sh check

      # Release only: the Developer ID certificate goes into a throwaway keychain (same as desktop.yml).
      - name: Import signing certificate
        if: steps.v.outputs.release == 'true'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          [ -n "$MACOS_CERTIFICATE_P12" ] || { echo "::error::The MACOS_CERTIFICATE_P12 secret is not set"; exit 1; }
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          for ca in DeveloperIDCA DeveloperIDG2CA; do
            curl -fsSL -o "$RUNNER_TEMP/$ca.cer" "https://www.apple.com/certificateauthority/$ca.cer"
            security import "$RUNNER_TEMP/$ca.cer" -k "$KEYCHAIN" || true
          done
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

      - name: Signed, notarized .dmg
        if: steps.v.outputs.release == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          export ASC_KEY_PATH="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$ASC_KEY_PATH"
          drive/build.sh dist
          spctl --assess --type open --context context:primary-signature -vv drive/dist/*.dmg

      - name: Remove signing keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8

      - name: Tag and GitHub release with the .dmg
        if: steps.v.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ASSETS: drive/dist
        run: scripts/github-release.sh drive "Cloudy Drive for macOS" false drive ios/Cloudy/Data
