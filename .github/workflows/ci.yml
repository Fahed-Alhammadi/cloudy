name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Type-check
        working-directory: app
        run: npm ci && npm run typecheck
      - name: Start stack
        run: |
          printf 'ADMIN_USER=admin\nADMIN_PASSWORD=ci-admin-password\n' > .env
          docker compose -f deploy/docker-compose.yml --env-file .env up -d --build --wait
      - name: End-to-end tests
        run: python3 tests/e2e.py http://localhost:8080 admin ci-admin-password
      - name: Logs on failure
        if: failure()
        run: docker compose -f deploy/docker-compose.yml --env-file .env logs filecloud

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew --no-daemon assembleDebug
